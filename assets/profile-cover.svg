    <rect x="558" y="218" width="214" height="42" rx="21" fill="#f28b3c" fill-opacity="0.14" stroke="#f4a261" stroke-opacity="0.55"/>
    <text x="665" y="244" fill="#fff0e5" text-anchor="middle">Local &amp; Sovereign AI</text>
  </g>

