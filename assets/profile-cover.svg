<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Rainer Hahnekamp — Production AI Engineering for Application Teams</title>
  <desc id="desc">Soverius AI profile banner highlighting Agentic Applications, Agentic Software Engineering, and Local and Sovereign AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326"/>
      <stop offset="0.55" stop-color="#0a1d38"/>
      <stop offset="1" stop-color="#12335e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b87c7"/>
      <stop offset="1" stop-color="#f28b3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4b87c7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4b87c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#79aee0" stroke-opacity="0.06"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#background)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="1080" cy="155" rx="270" ry="220" fill="url(#glow)"/>
  <path d="M0 316H1280" stroke="url(#accent)" stroke-width="8"/>

  <g fill="none" stroke="#72b9ec" stroke-linecap="round">
    <path d="M938 77C1008 105 1027 155 1085 166S1186 159 1246 210" stroke-opacity="0.24" stroke-width="2"/>
    <path d="M905 233C968 200 1005 198 1045 206S1128 249 1215 235" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M1030 31C1034 92 1060 119 1110 133S1199 124 1278 84" stroke-opacity="0.15" stroke-width="2"/>
  </g>
  <g fill="#8bd3ff" filter="url(#softGlow)">
    <circle cx="938" cy="77" r="4"/>
    <circle cx="1085" cy="166" r="6"/>
    <circle cx="1246" cy="210" r="4"/>
    <circle cx="905" cy="233" r="4"/>
    <circle cx="1045" cy="206" r="4"/>
    <circle cx="1215" cy="235" r="5"/>
    <circle cx="1030" cy="31" r="3"/>
    <circle cx="1110" cy="133" r="4"/>
  </g>

  <text x="64" y="60" fill="#8fbce4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">RAINER HAHNEKAMP</text>
  <text x="64" y="125" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="47" font-weight="750" letter-spacing="-1.2">Production AI Engineering</text>
  <text x="64" y="173" fill="#dce9f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="450">for Application Teams</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="64" y="218" width="205" height="42" rx="21" fill="#3268b0" fill-opacity="0.32" stroke="#5c9cdd" stroke-opacity="0.55"/>
    <text x="166.5" y="244" fill="#e9f4ff" text-anchor="middle">Agentic Applications</text>
    <rect x="282" y="218" width="263" height="42" rx="21" fill="#3268b0" fill-opacity="0.25" stroke="#5c9cdd" stroke-opacity="0.45"/>
